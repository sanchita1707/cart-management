<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Cart Management</h1>

        <section class="product-section">
            <h2>Add Product to Cart</h2>

            <div class="form-group">
                <label for="productName">Product Name</label>
                <input type="text" id="productName" placeholder="Enter product name">
            </div>

            <div class="form-group">
                <label for="productPrice">Price</label>
                <input type="number" id="productPrice" placeholder="Enter price" min="1">
            </div>

            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" placeholder="Enter quantity" min="1" value="1">
            </div>

            <button onclick="addToCart()">Add to Cart</button>
        </section>

        <section class="cart-section">
            <h2>Shopping Cart</h2>

            <table>
                <thead>
                    <tr>
                        <th>Sr. No.</th>
                        <th>Product Name</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="cartTableBody">
                </tbody>
            </table>

            <div class="cart-total">
                <strong>Grand Total: ₹<span id="grandTotal">0</span></strong>
            </div>
        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
